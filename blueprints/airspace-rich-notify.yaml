blueprint:
  name: Airspace · rich notify
  description: >-
    Sends a rich notification (title, distance/bearing/altitude/squawk, image,
    and tap-through link) when a chosen airspace-alert binary_sensor turns on.
    Designed for sensors like those produced by an ADS-B/airspace tracker
    integration that expose flight, hex, aircraft_type, distance_to, bearing_to,
    alt_baro_ft, squawk, and entity_picture attributes.
  domain: automation
  source_url: https://www.home-assistant.io/docs/blueprint/
  input:
    alert_sensor:
      name: Airspace Alert Sensor
      description: The binary_sensor that turns "on" when a military aircraft is nearby.
      selector:
        entity:
          domain: binary_sensor
    notify_action:
      name: Notify Service
      description: >-
        The legacy notify service to call, including the "notify." prefix
        (e.g. notify.nick_devices, notify.mobile_app_johns_phone).
      default: notify.notify
      selector:
        text: {}
    notification_title:
      name: Notification Title
      description: >-
        Notification title
      default: Airspace
      selector:
        text: {}

trigger:
  - trigger: state
    entity_id: !input alert_sensor
    to: "on"

variables:
  notification_title: !input notification_title
  hex: "{{ state_attr(trigger.entity_id, 'hex') }}"

action:
  - action: !input notify_action
    data:
      title: >-
        Airspace - {{ notification_title }} - {% set a = trigger.entity_id -%} 🚨 {{
        state_attr(a, 'flight') or hex }}{{ ' · ' ~
        state_attr(a, 'aircraft_type') if state_attr(a, 'aircraft_type') }}
      message: >-
        {% set a = trigger.entity_id -%} {% set d =
        (state_attr(a, 'distance_to') or {}).get('home') -%} {% set b =
        (state_attr(a, 'bearing_to') or {}).get('home') -%} {{ '%.1f
        nm'|format(d) if d is not none else '? nm' }} {{ 'brg
        %d°'|format(b|round(0)|int) if b is not none else '' }} · {{
        state_attr(a, 'alt_baro_ft') or '?' }} ft {% if state_attr(a, 'squawk')
        %}· squawk {{ state_attr(a, 'squawk') }}{% endif %}
      data:
        image: "{{ state_attr(trigger.entity_id, 'entity_picture') }}"
        channel: airspace
        clickAction: "https://globe.adsbexchange.com/?icao={{ hex }}"
        url: "https://globe.adsbexchange.com/?icao={{ hex }}"
